name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# 发布串行，进行中的构建不会被下一次合并中断。
concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.gate.outputs.sha }}
    steps:
      - uses: actions/github-script@v7
        id: gate
        with:
          script: |
            if (context.ref !== 'refs/heads/main') {
              core.setFailed('Only main can publish a release');
              return;
            }
            core.setOutput('sha', context.sha);

  validate:
    needs: gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.gate.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - id: version
        run: pnpm release:plan

  windows:
    needs: [gate, validate]
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      RELEASE_VERSION: ${{ needs.validate.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.gate.outputs.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Package Windows x64
        env:
          CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: pnpm exec electron-builder --win nsis --x64 --publish never "--config.extraMetadata.version=$env:RELEASE_VERSION"
      - name: Verify packaged updater and exit guards
        env:
          FYNVRA_TEST_APP_ROOT: ${{ github.workspace }}/dist/win-unpacked/resources/app.asar
        run: pnpm test:updates
      - name: Verify update artifacts
        run: pnpm release:verify dist "$env:RELEASE_VERSION"
      - uses: actions/upload-artifact@v4
        with:
          name: windows-release
          if-no-files-found: error
          compression-level: 0
          path: |
            dist/Fynvra-${{ env.RELEASE_VERSION }}-x64-setup.exe
            dist/Fynvra-${{ env.RELEASE_VERSION }}-x64-setup.exe.blockmap
            dist/latest.yml
            dist/SHA256SUMS

  macos:
    needs: [gate, validate]
    runs-on: macos-15
    timeout-minutes: 60
    outputs:
      signing_mode: ${{ steps.signing.outputs.signing_mode }}
    env:
      RELEASE_VERSION: ${{ needs.validate.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.gate.outputs.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - name: Select Mac signing mode
        id: signing
        env:
          MAC_CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          MAC_CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: node scripts/release.ts mac-mode
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # 单次构建汇总双架构元数据，禁止用两个任务互相覆盖 latest-mac.yml。
      - name: Package signed and notarized Mac x64 and arm64
        if: steps.signing.outputs.signing_mode == 'signed'
        env:
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: pnpm exec electron-builder --mac --x64 --arm64 --publish never "--config.extraMetadata.version=$RELEASE_VERSION"
      - name: Package Mac without Apple credentials
        if: steps.signing.outputs.signing_mode == 'manual'
        run: |
          echo "Mac packages use ad-hoc signatures and require manual installation; Apple notarization and automatic updates are disabled." >> "$GITHUB_STEP_SUMMARY"
          pnpm exec electron-builder --config electron-builder.mac-manual.yml --mac --x64 --arm64 --publish never "--config.extraMetadata.version=$RELEASE_VERSION"
      - name: Verify signatures and architectures
        shell: bash
        run: |
          for arch in x64 arm64; do
            directory=mac
            expected=x86_64
            if [ "$arch" = arm64 ]; then
              directory=mac-arm64
              expected=arm64
            fi
            bundle="dist/$directory/Fynvra.app"
            test "$(lipo -archs "$bundle/Contents/MacOS/Fynvra")" = "$expected"
            codesign --verify --deep --strict --verbose=2 "$bundle"
          done
      - name: Verify Developer ID and notarization
        if: steps.signing.outputs.signing_mode == 'signed'
        shell: bash
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          for directory in mac mac-arm64; do
            bundle="dist/$directory/Fynvra.app"
            codesign --display --verbose=4 "$bundle" 2>&1 | grep -Fx "TeamIdentifier=$APPLE_TEAM_ID"
            xcrun stapler validate "$bundle"
            spctl --assess --type execute --verbose=2 "$bundle"
          done
      - name: Verify packaged updater and exit guards
        env:
          FYNVRA_TEST_APP_ROOT: ${{ github.workspace }}/dist/mac-arm64/Fynvra.app/Contents/Resources/app.asar
        run: pnpm test:updates
      - name: Verify both architectures and update artifacts
        shell: bash
        env:
          MAC_SIGNING_MODE: ${{ steps.signing.outputs.signing_mode }}
        run: |
          platform=mac
          if [ "$MAC_SIGNING_MODE" = manual ]; then platform=mac-manual; fi
          node scripts/release.ts verify dist "$RELEASE_VERSION" "$platform" > release-files.txt
          mkdir -p release-assets
          while IFS= read -r file; do cp "dist/$file" release-assets/; done < release-files.txt
      - uses: actions/upload-artifact@v4
        with:
          name: macos-release
          if-no-files-found: error
          compression-level: 0
          path: release-assets/*

  publish:
    needs: [gate, validate, windows, macos]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_VERSION: ${{ needs.validate.outputs.version }}
      RELEASE_TAG: ${{ needs.validate.outputs.tag }}
      SOURCE_SHA: ${{ needs.gate.outputs.sha }}
      MAC_SIGNING_MODE: ${{ needs.macos.outputs.signing_mode }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.gate.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          pattern: '*-release'
          merge-multiple: true
          path: artifacts
      - name: Verify upload integrity and release order
        shell: bash
        run: |
          (cd artifacts && sha256sum --check SHA256SUMS && sha256sum --check SHA256SUMS-mac)
          node scripts/release.ts plan > release-plan.txt
          grep -Fx "version=$RELEASE_VERSION" release-plan.txt
          grep -Fx "sha=$SOURCE_SHA" release-plan.txt
      - name: Publish complete release
        shell: bash
        run: |
          title="Fynvra $RELEASE_VERSION"
          notes="Windows and Mac installers. See docs/RELEASE.md for installation and update details."
          if [ "$MAC_SIGNING_MODE" = manual ]; then
            title="$title (Mac manual install)"
            notes="Mac 包未使用 Apple Developer ID 证书签名或公证，仅使用 ad-hoc 签名。请从 DMG 拖入应用程序后手动安装；macOS 可能拦截启动，需要在系统设置的隐私与安全性中针对应用选择仍要打开。Mac 自动更新不可用，新版需重新下载覆盖安装。Windows 自动更新正常提供。"
          elif [ "$MAC_SIGNING_MODE" != signed ]; then
            echo "::error::Unknown Mac signing mode"
            exit 1
          fi
          if gh release view "$RELEASE_TAG" --json isDraft > release.json; then
            if [ "$(jq -r .isDraft release.json)" = "false" ]; then
              echo "Release already published; immutable assets are unchanged"
              exit 0
            fi
          else
            gh release create "$RELEASE_TAG" --target "$SOURCE_SHA" --title "$title" --notes "$notes" --generate-notes --draft
          fi
          assets=(
            "artifacts/Fynvra-$RELEASE_VERSION-x64-setup.exe"
            "artifacts/Fynvra-$RELEASE_VERSION-x64-setup.exe.blockmap"
            artifacts/latest.yml artifacts/SHA256SUMS artifacts/SHA256SUMS-mac
          )
          for arch in x64 arm64; do
            assets+=("artifacts/Fynvra-$RELEASE_VERSION-mac-$arch.dmg" "artifacts/Fynvra-$RELEASE_VERSION-mac-$arch.zip")
          done
          if [ "$MAC_SIGNING_MODE" = signed ]; then
            assets+=(artifacts/latest-mac.yml "artifacts/Fynvra-$RELEASE_VERSION-mac-x64.zip.blockmap" "artifacts/Fynvra-$RELEASE_VERSION-mac-arm64.zip.blockmap")
          else
            # 失败草稿重跑时，不能遗留上次签名模式上传的更新入口。
            gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name' > previous-assets.txt
            for name in latest-mac.yml "Fynvra-$RELEASE_VERSION-mac-x64.zip.blockmap" "Fynvra-$RELEASE_VERSION-mac-arm64.zip.blockmap"; do
              if grep -Fxq "$name" previous-assets.txt; then gh release delete-asset "$RELEASE_TAG" "$name" --yes; fi
            done
          fi
          gh release upload "$RELEASE_TAG" "${assets[@]}" --clobber
          gh release edit "$RELEASE_TAG" --title "$title" --draft=false --latest
