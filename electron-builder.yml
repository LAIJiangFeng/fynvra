appId: com.fynvra.app
productName: Fynvra
extraMetadata:
  fynvraMacUpdateMode: signed
directories:
  # 图标等打包资源；resources/icon.png 为 512x512 占位图
  buildResources: resources
  output: dist
files:
  - out/**
  - '!**/*.map'
# Magic Context 是运行时可解析的 vendored ESM 目录（不在 asar 内，Worker 用绝对路径动态 import）
extraResources:
  - from: packages/agent-runtime/vendor/magic-context
    to: magic-context
asarUnpack:
  - node_modules/node-pty/**
win:
  target: nsis
  # 显式提供多尺寸 ico，避免依赖构建时由 png 转换；exe 资源图标需要 signAndEditExecutable（默认开启）。
  icon: resources/icon.ico
  signAndEditExecutable: true
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  include: resources/installer.nsh
  installerIcon: resources/icon.ico
  uninstallerIcon: resources/icon.ico
  installerHeaderIcon: resources/icon.ico
  artifactName: ${productName}-${version}-${arch}-setup.${ext}
  deleteAppDataOnUninstall: false
mac:
  target: [dmg, zip]
  artifactName: ${productName}-${version}-mac-${arch}.${ext}
  category: public.app-category.developer-tools
  hardenedRuntime: true
  gatekeeperAssess: false
  forceCodeSigning: true
  notarize: true
  entitlements: resources/entitlements.mac.plist
  entitlementsInherit: resources/entitlements.mac.plist
linux:
  target: AppImage
  category: Development
npmRebuild: false
publish:
  provider: github
  owner: LAIJiangFeng
  repo: fynvra
  releaseType: release
