<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>番茄专注钟</title>
<meta name="description" content="番茄专注钟：25 分钟专注、短休息、长休息，配套任务清单与今日统计，离线可用。">
<style>
  :root {
    color-scheme: dark;
    --bg: #0d0f13;
    --surface: #161a21;
    --surface-2: #1c2230;
    --field: #11151c;
    --border: #28303c;
    --border-strong: #3a4350;
    --text: #e9edf5;
    --muted: #939eb0;
    --accent: #ff6b5b;
    --accent-strong: #ff8577;
    --accent-soft: rgba(255, 107, 91, 0.14);
    --radius: 16px;
    --t: 160ms ease;
    --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
      "Hiragino Sans GB", "Microsoft YaHei", "Source Han Sans SC", sans-serif;
  }

  *,
  *::before,
  *::after {
    box-sizing: border-box;
  }

  html {
    -webkit-text-size-adjust: 100%;
  }

  body {
    margin: 0;
    min-height: 100vh;
    overflow-x: hidden;
    background:
      radial-gradient(1100px 560px at 18% -12%, #1a2130 0%, var(--bg) 62%) fixed,
      var(--bg);
    color: var(--text);
    font-family: var(--font-sans);
    font-variant-numeric: tabular-nums;
    -webkit-font-smoothing: antialiased;
    line-height: 1.5;
  }

  h1,
  h2,
  p {
    margin: 0;
  }

  button,
  input {
    font: inherit;
    color: inherit;
  }

  button {
    background: none;
    border: 0;
    padding: 0;
    cursor: pointer;
  }

  :focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
    border-radius: 6px;
  }

  .sr-only {
    position: absolute;
    width: 1px;
    height: 1px;
    padding: 0;
    margin: -1px;
    overflow: hidden;
    clip: rect(0 0 0 0);
    white-space: nowrap;
    border: 0;
  }

  .shell {
    max-width: 1120px;
    margin: 0 auto;
    padding: 28px clamp(14px, 3vw, 32px) 44px;
  }

  .topbar {
    display: flex;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
    margin-bottom: 22px;
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 1.05rem;
    font-weight: 650;
    letter-spacing: 0.01em;
  }

  .brand-mark {
    width: 32px;
    height: 32px;
    border-radius: 10px;
    background: var(--accent-soft);
    color: var(--accent);
    display: grid;
    place-items: center;
  }

  .tagline {
    flex: 1 1 180px;
    min-width: 0;
    color: var(--muted);
    font-size: 0.84rem;
  }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: 0 20px 44px -34px rgba(0, 0, 0, 0.95);
  }

  .layout {
    display: grid;
    grid-template-columns: minmax(0, 1.12fr) minmax(310px, 0.88fr);
    gap: 18px;
    align-items: start;
  }

  .layout > * {
    min-width: 0;
  }

  .timer-card {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 18px;
    padding: clamp(18px, 3vw, 30px);
    grid-column: 1;
    grid-row: 1;
  }

  .modes {
    display: flex;
    gap: 4px;
    width: 100%;
    max-width: 430px;
    padding: 4px;
    border: 1px solid var(--border);
    border-radius: 999px;
    background: var(--field);
  }

  .mode {
    flex: 1 1 0;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    min-height: 34px;
    padding: 0 10px;
    border-radius: 999px;
    color: var(--muted);
    font-size: 0.84rem;
    transition: background var(--t), color var(--t);
  }

  .mode:hover {
    color: var(--text);
  }

  .mode.is-active {
    background: var(--accent-soft);
    color: var(--accent);
  }

  .mode-time {
    font-size: 0.72rem;
    opacity: 0.85;
    font-variant-numeric: tabular-nums;
  }

  .current-task {
    max-width: 100%;
    text-align: center;
    font-size: 0.9rem;
    color: var(--muted);
    overflow-wrap: anywhere;
  }

  .current-task.is-empty {
    opacity: 0.8;
  }

  .current-task span {
    color: var(--text);
    font-weight: 600;
  }

  .current-task.is-empty span {
    color: var(--muted);
    font-weight: 500;
  }

  .ring-wrap {
    position: relative;
    width: min(320px, 76vw);
    aspect-ratio: 1 / 1;
  }

  .ring {
    display: block;
    width: 100%;
    height: 100%;
  }

  .ring-track {
    fill: none;
    stroke: #212833;
    stroke-width: 9;
  }

  .ring-progress {
    fill: none;
    stroke: var(--accent);
    stroke-width: 9;
    stroke-linecap: round;
    transition: stroke-dashoffset 140ms linear;
  }

  .ring-center {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 6px;
    text-align: center;
  }

  .time {
    font-size: clamp(2.6rem, 9vw, 3.6rem);
    font-weight: 600;
    line-height: 1;
    letter-spacing: 0.01em;
    font-variant-numeric: tabular-nums;
  }

  .phase-label {
    font-size: 0.78rem;
    letter-spacing: 0.3em;
    text-indent: 0.3em;
    color: var(--muted);
  }

  .controls {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 12px;
  }

  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    min-height: 38px;
    padding: 0 16px;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: var(--surface-2);
    color: var(--text);
    font-size: 0.88rem;
    transition: background var(--t), border-color var(--t), color var(--t), transform var(--t);
  }

  .btn:hover {
    border-color: var(--border-strong);
    background: #242b36;
  }

  .btn:active {
    transform: translateY(1px);
  }

  .btn-primary {
    background: var(--accent);
    border-color: var(--accent);
    color: #1a0d0a;
    font-weight: 650;
  }

  .btn-primary:hover {
    background: var(--accent-strong);
    border-color: var(--accent-strong);
  }

  .btn-lg {
    min-height: 48px;
    padding: 0 36px;
    border-radius: 12px;
    font-size: 1rem;
  }

  .btn-ghost {
    background: transparent;
  }

  .cycle-hint {
    font-size: 0.78rem;
    color: var(--muted);
    letter-spacing: 0.02em;
    text-align: center;
  }

  .tasks-card {
    grid-column: 2;
    grid-row: 1;
    display: flex;
    flex-direction: column;
    gap: 14px;
    padding: clamp(16px, 2.4vw, 22px);
  }

  .card-head {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 10px;
  }

  .card-title {
    font-size: 1rem;
    font-weight: 650;
  }

  .card-count {
    font-size: 0.76rem;
    color: var(--muted);
  }

  .task-form {
    display: flex;
    gap: 8px;
  }

  .task-form input {
    flex: 1 1 auto;
    min-width: 0;
    height: 40px;
    padding: 0 12px;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: var(--field);
    color: var(--text);
    font-size: 0.88rem;
  }

  .task-form input::placeholder {
    color: #6b7583;
  }

  .task-form input:focus {
    outline: none;
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-soft);
  }

  .task-form .btn {
    flex: 0 0 auto;
    min-height: 40px;
  }

  .task-list {
    list-style: none;
    margin: 0;
    padding: 0;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .task {
    display: grid;
    grid-template-columns: auto minmax(0, 1fr) auto;
    gap: 10px;
    align-items: start;
    padding: 10px;
    border: 1px solid var(--border);
    border-radius: 12px;
    background: #12161d;
    transition: border-color var(--t), background var(--t);
  }

  .task:hover {
    border-color: var(--border-strong);
  }

  .task.is-current {
    border-color: var(--accent);
    background: linear-gradient(0deg, var(--accent-soft), var(--accent-soft)), #12161d;
  }

  .task-check {
    width: 22px;
    height: 22px;
    margin-top: 1px;
    border: 1.5px solid var(--border-strong);
    border-radius: 50%;
    display: grid;
    place-items: center;
    color: #10141a;
    font-size: 0.72rem;
    line-height: 1;
    transition: background var(--t), border-color var(--t);
  }

  .task-check:hover {
    border-color: var(--accent);
  }

  .task-check[aria-pressed="true"] {
    background: var(--accent);
    border-color: var(--accent);
  }

  .task-main {
    min-width: 0;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }

  .task-title {
    font-size: 0.92rem;
    line-height: 1.45;
    overflow-wrap: anywhere;
  }

  .task.is-done .task-title {
    color: var(--muted);
    text-decoration: line-through;
    text-decoration-thickness: 1px;
  }

  .task-meta {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 4px 12px;
    font-size: 0.74rem;
    color: var(--muted);
  }

  .task-count {
    white-space: nowrap;
  }

  .est {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    white-space: nowrap;
  }

  .est button {
    width: 20px;
    height: 20px;
    display: grid;
    place-items: center;
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--muted);
    font-size: 0.82rem;
    line-height: 1;
    transition: color var(--t), border-color var(--t);
  }

  .est button:hover {
    color: var(--text);
    border-color: var(--border-strong);
  }

  .est-value {
    min-width: 22px;
    text-align: center;
    color: var(--text);
    font-variant-numeric: tabular-nums;
  }

  .task-actions {
    display: flex;
    align-items: center;
    gap: 4px;
  }

  .task-actions .btn {
    min-height: 28px;
    padding: 0 8px;
    border-radius: 8px;
    font-size: 0.74rem;
  }

  .task-focus[aria-pressed="true"] {
    border-color: var(--accent);
    background: var(--accent-soft);
    color: var(--accent);
  }

  .task-delete {
    color: var(--muted);
    min-width: 28px;
    padding: 0 6px;
  }

  .task-delete:hover {
    color: var(--accent);
    border-color: var(--accent);
  }

  .task-edit {
    width: 100%;
    height: 32px;
    padding: 0 8px;
    border: 1px solid var(--accent);
    border-radius: 8px;
    background: #0f1319;
    color: var(--text);
    font-size: 0.92rem;
  }

  .task-edit:focus {
    outline: none;
    box-shadow: 0 0 0 3px var(--accent-soft);
  }

  .empty {
    padding: 18px 8px;
    text-align: center;
    color: var(--muted);
    font-size: 0.82rem;
  }

  .bottom {
    grid-column: 1 / -1;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 18px 28px;
    margin-top: 18px;
    padding: clamp(14px, 2.4vw, 20px) clamp(16px, 2.6vw, 24px);
  }

  .stats {
    display: flex;
    flex-wrap: wrap;
    gap: clamp(18px, 4vw, 42px);
  }

  .stat {
    display: flex;
    flex-direction: column;
    gap: 3px;
    min-width: 86px;
  }

  .stat-value {
    color: var(--accent);
    font-size: 1.5rem;
    font-weight: 600;
    line-height: 1.1;
    font-variant-numeric: tabular-nums;
  }

  .stat-label {
    color: var(--muted);
    font-size: 0.74rem;
    letter-spacing: 0.04em;
  }

  .bottom-tools {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 14px;
  }

  .settings {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
  }

  .field {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    color: var(--muted);
    font-size: 0.78rem;
  }

  .field input {
    width: 64px;
    height: 32px;
    padding: 0 8px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--field);
    color: var(--text);
    font-size: 0.82rem;
    font-variant-numeric: tabular-nums;
  }

  .field input:focus {
    outline: none;
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-soft);
  }

  .confirm-row {
    flex-basis: 100%;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 12px;
    padding: 12px 14px;
    border: 1px solid rgba(255, 107, 91, 0.4);
    border-radius: 10px;
    background: var(--accent-soft);
    font-size: 0.84rem;
  }

  .confirm-row[hidden] {
    display: none;
  }

  .confirm-row p {
    flex: 1 1 180px;
  }

  .notice {
    position: fixed;
    left: 50%;
    bottom: 22px;
    z-index: 50;
    max-width: min(460px, calc(100vw - 32px));
    padding: 12px 18px;
    border: 1px solid var(--border);
    border-radius: 12px;
    background: #1b212b;
    color: var(--text);
    font-size: 0.86rem;
    text-align: center;
    box-shadow: 0 18px 40px -22px rgba(0, 0, 0, 0.95);
    opacity: 0;
    transform: translate(-50%, 14px);
    pointer-events: none;
    transition: opacity var(--t), transform var(--t);
  }

  .notice.is-visible {
    opacity: 1;
    transform: translate(-50%, 0);
  }

  @media (max-width: 820px) {
    .layout {
      grid-template-columns: minmax(0, 1fr);
    }

    .timer-card,
    .tasks-card {
      grid-column: 1;
      grid-row: auto;
    }

    .ring-wrap {
      width: min(286px, 72vw);
    }

    .bottom {
      flex-direction: column;
      align-items: flex-start;
    }

    .stats {
      width: 100%;
      justify-content: space-between;
    }
  }

  @media (max-width: 520px) {
    .task {
      grid-template-columns: auto minmax(0, 1fr);
    }

    .task-actions {
      grid-column: 1 / -1;
      justify-content: flex-end;
    }

    .bottom-tools {
      width: 100%;
    }

    .stats {
      gap: 14px;
    }

    .stat {
      min-width: 72px;
    }
  }

  @media (prefers-reduced-motion: reduce) {
    *,
    *::before,
    *::after {
      transition: none !important;
      animation: none !important;
      scroll-behavior: auto !important;
    }
  }
</style>
</head>
<body>
<div class="shell">
  <header class="topbar">
    <h1 class="brand">
      <span class="brand-mark" aria-hidden="true">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" focusable="false">
          <circle cx="12" cy="13" r="8" stroke="currentColor" stroke-width="1.8"></circle>
          <path d="M12 9.5v4l2.6 1.8" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"></path>
          <path d="M9 3h6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"></path>
        </svg>
      </span>
      番茄专注钟
    </h1>
    <p class="tagline">25 分钟专注 · 任务清单 · 今日统计 · 数据只存在本机</p>
    <button type="button" id="soundBtn" class="btn btn-ghost" aria-pressed="true" aria-label="提示音开关">提示音：开</button>
  </header>

  <main class="layout">
    <section class="card timer-card" aria-labelledby="timerHeading">
      <h2 id="timerHeading" class="sr-only">计时器</h2>

      <div class="modes" role="group" aria-label="计时模式">
        <button type="button" class="mode" data-mode="focus" aria-pressed="true" aria-label="切换到专注模式">
          <span class="mode-name">专注</span><span class="mode-time">25′</span>
        </button>
        <button type="button" class="mode" data-mode="short" aria-pressed="false" aria-label="切换到短休息模式">
          <span class="mode-name">短休息</span><span class="mode-time">5′</span>
        </button>
        <button type="button" class="mode" data-mode="long" aria-pressed="false" aria-label="切换到长休息模式">
          <span class="mode-name">长休息</span><span class="mode-time">15′</span>
        </button>
      </div>

      <p id="currentTask" class="current-task is-empty">当前专注：<span id="currentTaskName">未选择任务</span></p>

      <div class="ring-wrap">
        <svg class="ring" viewBox="0 0 240 240" aria-hidden="true" focusable="false">
          <circle class="ring-track" cx="120" cy="120" r="104"></circle>
          <circle id="ringProgress" class="ring-progress" cx="120" cy="120" r="104" transform="rotate(-90 120 120)"></circle>
        </svg>
        <div class="ring-center">
          <div id="timeDisplay" class="time" aria-live="off">25:00</div>
          <div id="phaseLabel" class="phase-label">专注</div>
        </div>
      </div>

      <div class="controls">
        <button type="button" id="startPause" class="btn btn-primary btn-lg" aria-label="开始计时">开始</button>
        <button type="button" id="resetBtn" class="btn" aria-label="重置计时器">重置</button>
      </div>

      <p id="cycleHint" class="cycle-hint">已完成 0 / 4 个专注，再完成 4 个进入长休息</p>
    </section>

    <section class="card tasks-card" aria-labelledby="tasksHeading">
      <div class="card-head">
        <h2 id="tasksHeading" class="card-title">任务清单</h2>
        <span id="taskCount" class="card-count">共 0 个任务</span>
      </div>

      <form id="taskForm" class="task-form" autocomplete="off">
        <label class="sr-only" for="taskInput">任务标题</label>
        <input id="taskInput" type="text" maxlength="80" placeholder="添加任务，回车或点右侧按钮">
        <button type="submit" class="btn btn-primary" aria-label="添加任务">添加</button>
      </form>

      <ul id="taskList" class="task-list"></ul>
      <p id="emptyTasks" class="empty">还没有任务，先添加一个吧。</p>
    </section>

    <section class="card bottom" aria-label="今日统计与设置">
      <div class="stats">
        <div class="stat">
          <span class="stat-value" id="statRounds">0</span>
          <span class="stat-label">今日专注轮数</span>
        </div>
        <div class="stat">
          <span class="stat-value" id="statMinutes">0</span>
          <span class="stat-label">今日专注分钟</span>
        </div>
        <div class="stat">
          <span class="stat-value" id="statTasks">0</span>
          <span class="stat-label">今日完成任务</span>
        </div>
      </div>

      <div class="bottom-tools">
        <div class="settings" role="group" aria-label="时长设置">
          <label class="field" for="focusLen">专注
            <input id="focusLen" type="number" min="1" max="120" step="1" inputmode="numeric" value="25" aria-label="专注时长（分钟）">
            分
          </label>
          <label class="field" for="shortLen">短休
            <input id="shortLen" type="number" min="1" max="120" step="1" inputmode="numeric" value="5" aria-label="短休息时长（分钟）">
            分
          </label>
          <label class="field" for="longLen">长休
            <input id="longLen" type="number" min="1" max="120" step="1" inputmode="numeric" value="15" aria-label="长休息时长（分钟）">
            分
          </label>
        </div>
        <button type="button" id="clearStatsBtn" class="btn btn-ghost" aria-label="清空今日统计">清空今日统计</button>
      </div>

      <div id="confirmRow" class="confirm-row" hidden>
        <p>确认清空今日统计？专注轮数、专注分钟和完成任务数都会归零，此操作不可撤销。</p>
        <button type="button" id="confirmClear" class="btn btn-primary" aria-label="确认清空今日统计">确认清空</button>
        <button type="button" id="cancelClear" class="btn btn-ghost" aria-label="取消清空今日统计">取消</button>
      </div>
    </section>
  </main>
</div>

<div id="notice" class="notice" role="status" aria-live="polite" aria-atomic="true"></div>

<script>
(function () {
  "use strict";

  var STORAGE_KEY = "fynvra:focus-app:v1";
  var BASE_TITLE = "番茄专注钟";
  var MAX_TASKS = 200;
  var MAX_TITLE_LENGTH = 80;
  var RING_RADIUS = 104;
  var RING_CIRCUMFERENCE = 2 * Math.PI * RING_RADIUS;
  var MODES = {
    focus: { label: "专注", settingKey: "focus", modeName: "专注" },
    short: { label: "短休息", settingKey: "short", modeName: "短休息" },

    statMinutes: byId("statMinutes"),
    statTasks: byId("statTasks"),

          gain.gain.exponentialRampToValueAtTime(0.0001, now + offset + duration);

          gain.connect(ctx.destination);

  function renderTimer() {

    }
    if (dom.phaseLabel) {

  function buildTaskItem(task) {

    actions.appendChild(deleteBtn);

  function renderTasks() {

        showNotice("专注完成！休息 " + state.settings.short + " 分钟吧。");

    renderCurrentTask();
    renderStats();

  function addTask(title) {

    var task = {

      title: title.slice(0, MAX_TITLE_LENGTH),
      done: false,
      estimate: 1,
      completed: 0

    renderTasks();
    renderCurrentTask();
    return true;

  function beginEdit(id) {

      return;
    }
    var target = null;
    for (var i = 0; i < dom.taskList.children.length; i++) {
      var item = dom.taskList.children[i];
      if (item.getAttribute("data-id") === id) {
        target = item;
        break;
      }
    }
    if (!target) {
      return;
    }
    var titleEl = target.querySelector(".task-title");
    if (!titleEl) {
      return;

    input.maxLength = MAX_TITLE_LENGTH;

        return;

        event.preventDefault();

      }

      finish(true);
    });

  function handleTaskAction(action, id) {

          ? state.stats.tasksCompleted + 1
          : Math.max(0, state.stats.tasksCompleted - 1);
      });
      return;
    }
    if (action === "est-up") {
      updateTask(id, function (task) {
        task.estimate = clampInt(task.estimate + 1, 1, 8, 1);
      });
      return;
    }
    if (action === "est-down") {
      updateTask(id, function (task) {
        task.estimate = clampInt(task.estimate - 1, 1, 8, 1);
      });
      return;
    }
    if (action === "focus") {
      setCurrentTask(id);
      return;
    }
    if (action === "edit") {
      beginEdit(id);
      return;
    }
    if (action === "delete") {
      state.tasks = state.tasks.filter(function (task) {
        return task.id !== id;
      });
      if (state.currentTaskId === id) {

      save();
      renderTasks();
      renderCurrentTask();
      renderStats();

  function ensureToday() {

    state.stats.focusMinutes = 0;
    state.stats.tasksCompleted = 0;
    state.cycle = 0;
    save();
    return true;
  }

  function bindSetting(input, key) {

      state.settings[key] = value;
      input.value = String(value);
      save();
      if (!timer.running && timer.mode === SETTING_MODE[key]) {
        timer.totalMs = durationMs(timer.mode);
        timer.remainingMs = timer.totalMs;
      }
      renderTimer();
      renderModeButtons();
    };
    input.addEventListener("change", commit);
    input.addEventListener("blur", commit);
  }

  function focusNewTask() {
    if (!dom.taskInput) {
      return;
    }
    dom.taskInput.focus();
    dom.taskInput.select();
  }

  function showConfirm(visible) {
    if (!dom.confirmRow) {
      return;
    }
    dom.confirmRow.hidden = !visible;
    if (visible && dom.confirmClear) {
      dom.confirmClear.focus();
    }
  }

  function bindEvents() {
    if (dom.ringProgress) {
      dom.ringProgress.setAttribute("stroke-dasharray", RING_CIRCUMFERENCE.toFixed(2));
    }

    if (dom.startPause) {
      dom.startPause.addEventListener("click", toggleTimer);
    }
    if (dom.resetBtn) {
      dom.resetBtn.addEventListener("click", function () {
        resetTimer();
      });
    }

    if (dom.modeButtons) {
      for (var i = 0; i < dom.modeButtons.length; i++) {
        (function (btn) {
          btn.addEventListener("click", function () {
            var mode = btn.getAttribute("data-mode");
            if (mode && mode !== state.mode) {
              setMode(mode);
              renderAll();
            }
          });
        })(dom.modeButtons[i]);
      }
    }

    if (dom.soundBtn) {
      dom.soundBtn.addEventListener("click", function () {
        state.sound = !state.sound;
        save();
        renderSound();
        if (state.sound) {
          ensureAudio();
          showNotice("提示音已开启。");
        } else {
          showNotice("提示音已关闭。");
        }
      });
    }

    if (dom.taskForm) {
      dom.taskForm.addEventListener("submit", function (event) {
        event.preventDefault();
        if (!dom.taskInput) {
          return;
        }
        var title = dom.taskInput.value.trim();
        if (!title) {
          showNotice("请先输入任务标题。");
          dom.taskInput.focus();
          return;
        }
        if (addTask(title)) {
          dom.taskInput.value = "";
          dom.taskInput.focus();
        }
      });
    }

    if (dom.taskList) {
      dom.taskList.addEventListener("click", function (event) {
        var target = event.target;
        if (!(target instanceof Element)) {
          return;
        }
        var actionBtn = target.closest("button[data-act]");
        var item = target.closest("li.task");
        if (!item) {
          return;
        }
        var id = item.getAttribute("data-id");
        if (!id) {
          return;
        }
        if (actionBtn) {
          var action = actionBtn.getAttribute("data-act");
          if (action) {
            handleTaskAction(action, id);
          }
          return;
        }
        if (!target.closest("input") && state.currentTaskId !== id) {
          setCurrentTask(id);
        }
      });

      dom.taskList.addEventListener("dblclick", function (event) {
        var target = event.target;
        if (!(target instanceof Element)) {
          return;
        }
        if (!target.classList.contains("task-title")) {
          return;
        }
        var item = target.closest("li.task");
        if (!item) {
          return;
        }
        var id = item.getAttribute("data-id");
        if (id) {
          beginEdit(id);
        }
      });
    }

    if (dom.clearStatsBtn) {
      dom.clearStatsBtn.addEventListener("click", function () {
        showConfirm(true);
      });
    }
    if (dom.cancelClear) {
      dom.cancelClear.addEventListener("click", function () {
        showConfirm(false);
      });
    }
    if (dom.confirmClear) {
      dom.confirmClear.addEventListener("click", function () {
        state.stats.focusRounds = 0;
        state.stats.focusMinutes = 0;
        state.stats.tasksCompleted = 0;
        state.stats.date = todayKey();
        state.cycle = 0;
        save();
        renderStats();
        renderCycleHint();
        showConfirm(false);
        showNotice("今日统计已清空。");
      });
    }

    bindSetting(dom.focusLen, "focus");
    bindSetting(dom.shortLen, "short");
    bindSetting(dom.longLen, "long");

    document.addEventListener("keydown", function (event) {
      if (event.defaultPrevented || event.metaKey || event.ctrlKey || event.altKey) {
        return;
      }
      var target = event.target;
      if (target instanceof Element && target.closest("input, textarea, select, [contenteditable='true']")) {
        return;
      }
      if (event.key === "Escape" && dom.confirmRow && !dom.confirmRow.hidden) {
        showConfirm(false);
        return;
      }
      if (event.key === " " || event.code === "Space") {
        if (target instanceof Element && target.closest("button, a")) {
          return;
        }
        event.preventDefault();
        toggleTimer();
      } else if (event.key === "r" || event.key === "R") {
        event.preventDefault();
        resetTimer();
      } else if (event.key === "n" || event.key === "N") {
        event.preventDefault();
        focusNewTask();
      }
    });

    document.addEventListener("visibilitychange", function () {
      if (document.hidden) {
        return;
      }
      if (ensureToday()) {
        renderStats();
        renderCycleHint();
      }
      if (timer.running) {
        tick();
      }
    });
  }

  timer.totalMs = durationMs(timer.mode);
  timer.remainingMs = timer.totalMs;

  bindEvents();
  ensureToday();
  renderAll();
})();
</script>
</body>
</html>
